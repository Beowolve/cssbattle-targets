name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: "main"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release_notes:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        uses: ./.github/actions/generate-release-notes
        with:
          config: cliff.toml
          output-file: RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          body_path: RELEASE_NOTES.md
          make_latest: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Notify Discord about release notes
        uses: ./.github/actions/notify-discord-release
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          tag-name: ${{ github.ref_name }}
          release-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          notes-path: RELEASE_NOTES.md
          username: CSSBattle Targets Releases
          title-prefix: CSSBattle Targets

  deploy_ftp_release:
    if: ${{ github.event_name == 'push' }}
    needs: release_notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ftp-deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Validate Supabase build secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for key in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Build app via reusable action
        uses: ./.github/actions/build-react-app
        env:
          # Use GitHub Secrets for Vite build-time env values in CI/CD.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          node-version-file: .nvmrc
          install-command: npm ci
          build-command: npm run build

      - name: Deploy dist via reusable action
        uses: ./.github/actions/deploy-ftp
        with:
          local-dir: dist
          ftp-host: ${{ secrets.FTP_HOST }}
          ftp-port: ${{ secrets.FTP_PORT || '21' }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          ftp-remote-dir: ${{ secrets.FTP_REMOTE_DIR }}
          ftp-secure: ${{ secrets.FTP_SECURE || 'false' }}

  deploy_ftp_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ftp-deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Validate Supabase build secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for key in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Build app via reusable action
        uses: ./.github/actions/build-react-app
        env:
          # Use GitHub Secrets for Vite build-time env values in CI/CD.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          node-version-file: .nvmrc
          install-command: npm ci
          build-command: npm run build

      - name: Deploy dist via reusable action
        uses: ./.github/actions/deploy-ftp
        with:
          local-dir: dist
          ftp-host: ${{ secrets.FTP_HOST }}
          ftp-port: ${{ secrets.FTP_PORT || '21' }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          ftp-remote-dir: ${{ secrets.FTP_REMOTE_DIR }}
          ftp-secure: ${{ secrets.FTP_SECURE || 'false' }}
